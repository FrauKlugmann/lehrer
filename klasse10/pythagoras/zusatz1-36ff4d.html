<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pythagoras – Dreieckslegekasten</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;color:#17354b;background:#fff;overflow:hidden}header{height:70px;background:#123653;color:white;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:10px 22px}h1{font-size:clamp(19px,2vw,30px);margin:0}header p{margin:3px 0 0;font-size:13px;color:#d7e8f1}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{border:1px solid #a4bbc9;border-radius:9px;background:#e9f2f5;color:#153c55;padding:11px 15px;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(1px)}button:focus-visible{outline:3px solid #f4ca7a}#board{display:block;width:100%;height:calc(100dvh - 70px);touch-action:none;background:#fff}.piece{cursor:grab;touch-action:none}.piece:active{cursor:grabbing}.piece polygon{stroke:#354c5d;stroke-width:2.1;stroke-linejoin:round;vector-effect:non-scaling-stroke}.piece.selected polygon{stroke:#0877ab;stroke-width:3.5;filter:drop-shadow(0 2px 3px #0003)}.piece .rightmark{fill:none;stroke:#405b6a;stroke-width:1.5;pointer-events:none}.piece text{font-size:13px;pointer-events:none}.note{position:absolute;bottom:12px;left:16px;color:#506674;font-size:13px;background:#ffffffd9;padding:5px 9px;border-radius:6px;pointer-events:none}@media(max-width:850px){header{height:auto;min-height:75px;padding:7px 10px}h1{font-size:17px}header p{font-size:11px}.tools button{font-size:13px;padding:8px}#board{height:calc(100dvh - 85px)}.note{font-size:11px}}
</style></head><body><header><div><h1>Pythagoras – Dreieckslegekasten</h1><p>Verschieben · Seiten verbinden · Drehen · Doppeltippen zum Trennen</p></div><div class="tools"><button id="left" title="Ausgewählte Gruppe um 45° nach links drehen">↶ 45°</button><button id="right" title="Ausgewählte Gruppe um 45° nach rechts drehen">↷ 45°</button><button id="detach">Verbindung lösen</button><button id="reset">Zurücksetzen</button></div></header><svg id="board" xmlns="http://www.w3.org/2000/svg" aria-label="Interaktive Arbeitsfläche mit neun Dreiecken"><g id="pieces"></g></svg><div class="note">Tipp: Dreieck antippen, dann drehen. Passende Kanten rasten automatisch ein.</div><script>
(()=>{'use strict';
const svg=document.getElementById('board'),layer=document.getElementById('pieces');const NS='http://www.w3.org/2000/svg';
const L=112, colors=['#bfe5f7',...Array(4).fill('#fff0a8'),...Array(4).fill('#f5b6cf')];
let pieces=[],selected=null,drag=null,lastTap={id:-1,t:0},nextGroup=1;
const vec=(x,y)=>({x,y}),add=(a,b)=>vec(a.x+b.x,a.y+b.y),sub=(a,b)=>vec(a.x-b.x,a.y-b.y),len=v=>Math.hypot(v.x,v.y),rot=(p,a)=>{let c=Math.cos(a),s=Math.sin(a);return vec(p.x*c-p.y*s,p.x*s+p.y*c)};
const local=[vec(0,0),vec(L,0),vec(0,L)];
function dims(){const r=svg.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.setAttribute('preserveAspectRatio','none');return {w:r.width,h:r.height}}
function initial(){
  const {w,h}=dims();
  // Neun Dreiecke in einer kompakten Ablage rechts; links bleibt die Legefläche frei.
  const cols=3, rows=3, margin=18;
  const stepX=L+14, stepY=L+14;
  const rackWidth=cols*L+(cols-1)*14;
  const rackHeight=rows*L+(rows-1)*14;
  const startX=Math.max(margin, w-rackWidth-margin);
  const startY=Math.max(margin,(h-rackHeight)/2);
  pieces=colors.map((color,i)=>({id:i,color,
    x:startX+(i%cols)*stepX,
    y:startY+Math.floor(i/cols)*stepY,
    angle:0,group:i+1}));
  nextGroup=10;selected=null;drag=null;lastTap={id:-1,t:0};render();
}
function vertices(p){return local.map(v=>add(vec(p.x,p.y),rot(v,p.angle)))}
function edges(p){let v=vertices(p);return [[v[0],v[1]],[v[1],v[2]],[v[2],v[0]]]}
function group(id){let p=pieces.find(q=>q.id===id);return p?pieces.filter(q=>q.group===p.group):[]}
function el(name,attrs={}){let e=document.createElementNS(NS,name);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}
function render(){layer.replaceChildren();for(let p of pieces){let g=el('g',{class:'piece'+(selected!==null&&group(selected).some(q=>q.id===p.id)?' selected':''),'data-id':p.id});let v=vertices(p);g.append(el('polygon',{points:v.map(t=>`${t.x},${t.y}`).join(' '),fill:p.color}));
// Rechter Winkel: Viertelkreisbogen um den Scheitel und Punkt zwischen Scheitel und Bogen.
const vertex=v[0], radius=20;
const arcStart=add(vertex,rot(vec(radius,0),p.angle));
const arcEnd=add(vertex,rot(vec(0,radius),p.angle));
const arcMid=add(vertex,rot(vec(radius/Math.SQRT2,radius/Math.SQRT2),p.angle));
g.append(el('path',{class:'rightmark',d:`M ${arcStart.x} ${arcStart.y} A ${radius} ${radius} 0 0 1 ${arcEnd.x} ${arcEnd.y}`}));
const dot=add(vertex,rot(vec(8,8),p.angle));
g.append(el('circle',{class:'rightdot',cx:dot.x,cy:dot.y,r:2.6,fill:'#405b6a','pointer-events':'none'}));
layer.append(g)}}
function pointer(e){let r=svg.getBoundingClientRect();return vec(e.clientX-r.left,e.clientY-r.top)}
function moveGroup(id,delta){for(let p of group(id)){p.x+=delta.x;p.y+=delta.y}}
function merge(g1,g2){let a=pieces.find(p=>p.group===g1),b=pieces.find(p=>p.group===g2);if(!a||!b||g1===g2)return;for(let p of pieces)if(p.group===g2)p.group=g1}
function snap(id){let moving=group(id);if(!moving.length)return;let best=null;for(let a of moving)for(let ea of edges(a))for(let b of pieces){if(b.group===a.group)continue;for(let eb of edges(b)){let la=len(sub(ea[1],ea[0])),lb=len(sub(eb[1],eb[0]));if(Math.abs(la-lb)>1)continue;let d1=sub(eb[1],ea[0]),d2=sub(eb[0],ea[1]);let error=Math.max(len(d1),len(d2));if(error<19&&(!best||error<best.error))best={error,delta:vec((d1.x+d2.x)/2,(d1.y+d2.y)/2),other:b.group}}}if(best){let g=moving[0].group;moveGroup(id,best.delta);merge(g,best.other);return true}return false}
function rotateGroup(id,sign){let members=group(id);if(!members.length)return;let points=members.flatMap(vertices);let cx=points.reduce((s,p)=>s+p.x,0)/points.length,cy=points.reduce((s,p)=>s+p.y,0)/points.length;let center=vec(cx,cy),angle=sign*Math.PI/4;for(let p of members){let np=add(center,rot(sub(vec(p.x,p.y),center),angle));p.x=np.x;p.y=np.y;p.angle=(p.angle+angle+Math.PI*2)%(Math.PI*2)}snap(id);render()}
function detach(id){let members=group(id);for(let p of members)p.group=nextGroup++;render()}
svg.addEventListener('pointerdown',e=>{let node=e.target.closest('.piece');if(!node)return;e.preventDefault();let id=Number(node.dataset.id),pt=pointer(e),now=performance.now();if(lastTap.id===id&&now-lastTap.t<370){selected=id;detach(id);lastTap={id:-1,t:0};return}lastTap={id,t:now};selected=id;drag={id,point:pt,moved:false,pointerId:e.pointerId};svg.setPointerCapture(e.pointerId);render()});
svg.addEventListener('pointermove',e=>{if(!drag||drag.pointerId!==e.pointerId)return;e.preventDefault();let pt=pointer(e),delta=sub(pt,drag.point);if(len(delta)>0){moveGroup(drag.id,delta);drag.point=pt;drag.moved=true;render()}});
function end(e){if(!drag||drag.pointerId!==e.pointerId)return;let id=drag.id;if(drag.moved)snap(id);drag=null;render()}
svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
document.getElementById('left').onclick=()=>{if(selected!==null)rotateGroup(selected,-1)};document.getElementById('right').onclick=()=>{if(selected!==null)rotateGroup(selected,1)};document.getElementById('detach').onclick=()=>{if(selected!==null)detach(selected)};document.getElementById('reset').onclick=initial;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){selected=null;render()}else if(e.key==='ArrowLeft'&&selected!==null){e.preventDefault();rotateGroup(selected,-1)}else if(e.key==='ArrowRight'&&selected!==null){e.preventDefault();rotateGroup(selected,1)}else if(e.key==='Delete'&&selected!==null)detach(selected)});
// Erst nach dem Browser-Layout messen: sonst kann die SVG-Breite beim Start 0 sein.
requestAnimationFrame(()=>requestAnimationFrame(initial));
window.addEventListener('resize',()=>{const r=svg.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);});
})();
</script></body></html>
